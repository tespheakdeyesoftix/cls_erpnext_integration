; Example for this bench. Install using your deployment's Supervisor includes.
; Run exactly one bridge for each site; Redis also enforces a per-site lease.
[program:homeall-chat-homeall.dev]
command=/home/erpuser/homeall-bench-dev/env/bin/python -m homeall_ecommerce_integration.homeall_ecommerce_integration.page.chat.bridge --site homeall.dev --sites-path /home/erpuser/homeall-bench-dev/sites
directory=/home/erpuser/homeall-bench-dev
user=erpuser
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/erpuser/homeall-bench-dev/logs/chat-bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
